[package]
name = "lapsewerk-video"
description = "Lapsewerk's video writer: ProRes and HEVC movies through AVFoundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
